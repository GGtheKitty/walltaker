# Preserve the scheme supplied by the outer TLS terminator (for Rails SSL).
map $http_x_forwarded_proto $walltaker_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

map $request_method $wallpaper_read_backend {
    default web:3000;
    GET wallpaper_api:3002;
    HEAD wallpaper_api:3002;
    OPTIONS wallpaper_api:3002;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 0;
    underscores_in_headers on;

    # Docker DNS is resolved per request so service recreation is supported.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location ^~ /_internal/ {
        return 404;
    }

    location ^~ /_anycable {
        return 404;
    }

    location ~ ^/api/links(?:\.json|/[0-9]+(?:\.json|/widget\.json))$ {
        proxy_pass http://$wallpaper_read_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $walltaker_scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 15s;
    }

    location ~ ^/api/(?:users/[^/]+\.json|links/[0-9]+/response\.json)$ {
        set $api_backend wallpaper_api:3002;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $walltaker_scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        # These endpoints accept API keys in query parameters.
        access_log off;
    }

    location = /e621-media {
        set $media_backend e621_media:3001;
        proxy_pass http://$media_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_read_timeout 40s;
        # The query contains a signed bearer token.
        access_log off;
    }

    location / {
        set $rails_backend web:3000;
        proxy_pass http://$rails_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $walltaker_scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}
