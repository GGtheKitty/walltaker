services:
  database:
    image: postgres:14
    restart: unless-stopped
    volumes:
      - ./.docker/volumes/walltaker_database3:/var/lib/postgresql/data
      - ./scripts/postgres-init-app-role.sh:/docker-entrypoint-initdb.d/10-create-app-role.sh:ro
    environment:
      - POSTGRES_USER=${DB_ADMIN_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_ADMIN_PASSWORD}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      - RI_LOG_LEVEL=info
      #- REDIS_ARGS=--requirepass your_password_here --appendonly yes
      #- REDIS_ARGS=save 60 1000 --requirepass your_password_here --appendonly yes
    volumes:
      - redis-data-v2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backend

volumes:
  redis-data-v2:

networks:
  backend:
  frontend:
