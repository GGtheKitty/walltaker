services:
  database:
    image: postgres:14
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - ${DB_HOST_PORT}:${DB_PORT}
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      - RI_LOG_LEVEL=info
      #- REDIS_ARGS=--requirepass your_password_here --appendonly yes
      #- REDIS_ARGS=save 60 1000 --requirepass your_password_here --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - ${CACHE_HOST_PORT}:${CACHE_PORT}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:

networks:
  backend:
  frontend:

