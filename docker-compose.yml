services:
  migrate:
    build:
      context: .
      dockerfile: services/database/Dockerfile
    restart: "no"
    mem_limit: 128m
    memswap_limit: 160m
    cpus: 0.5
    environment:
      DATABASE_URL: postgres://${DB_ADMIN_USER}:${DB_ADMIN_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      WALLPAPER_API_DB_USER: ${WALLPAPER_API_DB_USER}
      WALLPAPER_API_DB_PASSWORD: ${WALLPAPER_API_DB_PASSWORD}
      WALLPAPER_WRITER_DB_USER: ${WALLPAPER_WRITER_DB_USER}
      WALLPAPER_WRITER_DB_PASSWORD: ${WALLPAPER_WRITER_DB_PASSWORD}
      LINK_MANAGER_DB_USER: ${LINK_MANAGER_DB_USER}
      LINK_MANAGER_DB_PASSWORD: ${LINK_MANAGER_DB_PASSWORD}
      REALTIME_DB_USER: ${REALTIME_DB_USER}
      REALTIME_DB_PASSWORD: ${REALTIME_DB_PASSWORD}
      ACCOUNTS_DB_USER: ${ACCOUNTS_DB_USER}
      ACCOUNTS_DB_PASSWORD: ${ACCOUNTS_DB_PASSWORD}
      SOCIAL_DB_USER: ${SOCIAL_DB_USER}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD}
      DISCOVERY_DB_USER: ${DISCOVERY_DB_USER}
      DISCOVERY_DB_PASSWORD: ${DISCOVERY_DB_PASSWORD}
      TRACKER_DB_USER: ${TRACKER_DB_USER}
      TRACKER_DB_PASSWORD: ${TRACKER_DB_PASSWORD}
      MODERATION_DB_USER: ${MODERATION_DB_USER}
      MODERATION_DB_PASSWORD: ${MODERATION_DB_PASSWORD}
      AUTOMATION_DB_USER: ${AUTOMATION_DB_USER}
      AUTOMATION_DB_PASSWORD: ${AUTOMATION_DB_PASSWORD}
      ACTIVITY_DB_USER: ${ACTIVITY_DB_USER}
      ACTIVITY_DB_PASSWORD: ${ACTIVITY_DB_PASSWORD}
      BROWSER_DB_USER: ${BROWSER_DB_USER}
      BROWSER_DB_PASSWORD: ${BROWSER_DB_PASSWORD}
      DELIVERY_DB_USER: ${DELIVERY_DB_USER}
      DELIVERY_DB_PASSWORD: ${DELIVERY_DB_PASSWORD}
      BLAZER_DB_USER: ${BLAZER_DB_USER}
      BLAZER_DB_PASSWORD: ${BLAZER_DB_PASSWORD}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - backend

  node_web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 160m
    cpus: 0.5
    environment:
      NODE_OPTIONS: --max-old-space-size=64
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      WALLTAKER_BASE_URL: ${WALLTAKER_URL}
      BROWSER_BACKEND_URL: http://wallpaper_api:3002
      ACCOUNTS_BACKEND_URL: http://accounts:3003
      NODE_WEB_ASSET_DIR: /app/web/dist
      # Outer TLS proxy and the internal Nginx router.
      NODE_WEB_TRUST_PROXY_HOPS: "2"
      COMMIT_HASH: ${COMMIT_HASH:-}
      COMMIT_LINK: ${COMMIT_LINK:-}
      RELEASE_CREATED_AT: ${RELEASE_CREATED_AT:-}
    depends_on:
      - wallpaper_api
    networks:
      - frontend
      - backend

  accounts:
    build: ./services/accounts
    restart: unless-stopped
    mem_limit: 160m
    memswap_limit: 192m
    cpus: 0.5
    environment:
      DATABASE_URL: postgres://${ACCOUNTS_DB_USER}:${ACCOUNTS_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  router:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:8080"
    volumes:
      - ./services/router/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - node_web
      - e621_media
      - wallpaper_api
      - cable
    networks:
      - frontend

  e621_media:
    build: ./services/e621-media
    restart: unless-stopped
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      E621_USER_AGENT: ${WALLTAKER_HOST} (forked from ailurus and run by ${E621_USER})
    networks:
      - frontend

  wallpaper_api:
    build:
      context: ./services
      dockerfile: wallpaper-api/Dockerfile
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 320m
    cpus: 1.0
    environment:
      NODE_OPTIONS: --max-old-space-size=128
      DATABASE_URL: postgres://${WALLPAPER_API_DB_USER}:${WALLPAPER_API_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      WALLPAPER_WRITER_DATABASE_URL: postgres://${WALLPAPER_WRITER_DB_USER}:${WALLPAPER_WRITER_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      LINK_MANAGER_DATABASE_URL: postgres://${LINK_MANAGER_DB_USER}:${LINK_MANAGER_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      MODERATION_DATABASE_URL: postgres://${MODERATION_DB_USER}:${MODERATION_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      AUTOMATION_DATABASE_URL: postgres://${AUTOMATION_DB_USER}:${AUTOMATION_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      DELIVERY_DATABASE_URL: postgres://${DELIVERY_DB_USER}:${DELIVERY_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_SMTP_PASSWORD: ${RESEND_SMTP_PASSWORD:-}
      RESEND_SMTP_ADDRESS: ${RESEND_SMTP_ADDRESS:-smtp.resend.com}
      RESEND_SMTP_PORT: ${RESEND_SMTP_PORT:-587}
      RESEND_SMTP_USER_NAME: ${RESEND_SMTP_USER_NAME:-resend}
      RESEND_SMTP_AUTHENTICATION: ${RESEND_SMTP_AUTHENTICATION:-plain}
      RESEND_SMTP_ENABLE_STARTTLS_AUTO: ${RESEND_SMTP_ENABLE_STARTTLS_AUTO:-true}
      WALLTAKER_MAIL_FROM: ${WALLTAKER_MAIL_FROM:-walltaker@${WALLTAKER_HOST}}
      BROWSER_DATABASE_URL: postgres://${BROWSER_DB_USER}:${BROWSER_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      ACCOUNTS_INTERNAL_URL: http://accounts:3003
      ACTIVITY_DATABASE_URL: postgres://${ACTIVITY_DB_USER}:${ACTIVITY_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      BLAZER_DATABASE_URL: postgres://${BLAZER_DB_USER}:${BLAZER_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      PORNBOT_INTERVAL_SECONDS: ${PORNBOT_INTERVAL_SECONDS:-600}
      TRACKER_DATABASE_URL: postgres://${TRACKER_DB_USER}:${TRACKER_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      DISCOVERY_DATABASE_URL: postgres://${DISCOVERY_DB_USER}:${DISCOVERY_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      SOCIAL_DATABASE_URL: postgres://${SOCIAL_DB_USER}:${SOCIAL_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      REALTIME_DATABASE_URL: postgres://${REALTIME_DB_USER}:${REALTIME_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      REDIS_URL: redis://${CACHE_HOST}:${CACHE_PORT}/1
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      WALLTAKER_BASE_URL: ${WALLTAKER_URL}
      NODE_WEB_INTERNAL_URL: http://node_web:3004
      E621_USER_AGENT: ${WALLTAKER_HOST} (forked from ailurus and run by ${E621_USER})
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      accounts:
        condition: service_started
    networks:
      - backend
      - frontend

  database:
    image: postgres:14
    restart: unless-stopped
    volumes:
      - postgres-data-v2:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 30s
      timeout: 5s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data-v2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backend

  cable:
    image: walltaker-cable
    build: ./services/cable
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 128m
    memswap_limit: 160m
    cpus: 0.5
    ports:
      - "${CABLE_HOST_PORT:-127.0.0.1:8080}:8080"
    depends_on:
      - redis
      - wallpaper_api
    environment:
      NODE_OPTIONS: --max-old-space-size=64
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      REDIS_URL: redis://${CACHE_HOST}:${CACHE_PORT}/1
      REALTIME_RPC_URL: http://wallpaper_api:3002/_internal/realtime-rpc
      CABLE_REDIS_CHANNEL: __anycable__
    networks:
      - backend
      - frontend

volumes:
  postgres-data-v2:
  redis-data-v2:

networks:
  backend:
  frontend:
