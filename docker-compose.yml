version: "3"
services:
  postgres:
    image: postgres:14
    volumes:
      - ./.docker/volumes/walltaker_database2:/var/lib/postgresql/data
    env_file:
      - .env

  redis:
    image: redis:7-alpine

  web:
    build: .
    command: bash -lc 'ruby -rsocket -e "loop { begin; TCPSocket.new(\"postgres\", 5432).close; break; rescue; sleep 1; end }" && bundle exec rails assets:precompile && bundle exec rails db:prepare && bundle exec rails server -e production -b 0.0.0.0'
    volumes:
      - ./:/ror
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    env_file:
      - .env

  pornbot_scheduler:
    build: .
    command: bash -lc 'ruby -rsocket -e "loop { begin; TCPSocket.new(\"postgres\", 5432).close; break; rescue; sleep 1; end }" && while true; do bundle exec rake walltaker:porn_bot_round; sleep "$${PORNBOT_INTERVAL_SECONDS:-600}"; done'
    volumes:
      - ./:/ror
    depends_on:
      - postgres
      - redis
    env_file:
      - .env
