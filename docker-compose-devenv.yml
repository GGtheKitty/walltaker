# VPS test site: layer over docker-compose.yml with scripts/devenv.
services:
  migrate:
    volumes:
      - ./db:/source/db:ro
      - ./services/database/migrate.js:/source/services/database/migrate.js:ro
      - ./services/database/clients.json:/source/services/database/clients.json:ro
      - ./services/database/system-profiles.json:/source/services/database/system-profiles.json:ro
      - ./scripts:/source/scripts:ro
  node_web:
    command: ["node", "scripts/dev.js"]
    mem_limit: 192m
    memswap_limit: 224m
    environment:
      WALLTAKER_LIVE_RELOAD: "true"
    volumes:
      - ./services/web/src:/app/web/src:ro
      - ./services/web/scripts:/app/web/scripts:ro
      - ./services/web/frontend:/app/web/frontend:ro
      - ./app/javascript:/app/source/app/javascript:ro
      - ./app/assets:/app/source/app/assets:ro
      - ./public:/app/source/public:ro
      - ./services/e621-media/src/token.js:/app/e621-media/src/token.js:ro
      - ./services/wallpaper-api/src/browser-cookies.js:/app/wallpaper-api/src/browser-cookies.js:ro

  accounts:
    command: ["node", "--watch", "--watch-preserve-output", "src/server.js"]
    volumes:
      - ./services/accounts/src:/app/src:ro

  e621_media:
    command: ["node", "--watch", "--watch-preserve-output", "src/server.js"]
    volumes:
      - ./services/e621-media:/app:ro

  router:
    # Mount the directory so atomic editor saves do not leave a stale inode.
    volumes: !override
      - ./services/router:/etc/nginx/conf.d:ro

  wallpaper_api:
    command: ["node", "--watch", "--watch-preserve-output", "src/server.js"]
    volumes:
      - ./services/wallpaper-api/src:/app/wallpaper-api/src:ro
      - ./services/e621-media/src:/app/e621-media/src:ro
