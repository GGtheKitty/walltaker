default: &default
  broadcast_adapter: redis
  redis_url: <%= ENV.fetch("ANYCABLE_REDIS_URL", ENV.fetch("REDIS_URL", "redis://localhost:6379/1")) %>
  redis_channel: __anycable__
  websocket_url: <%= ENV.fetch("ANYCABLE_WEBSOCKET_URL", "/cable") %>
  http_rpc_mount_path: /_anycable

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
